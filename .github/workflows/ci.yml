name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Format check
        run: test -z "$(gofmt -l ./...)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o gophish .
      - name: Test
        run: go test ./...
